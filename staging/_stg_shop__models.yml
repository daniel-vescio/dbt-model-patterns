models:
  - name: stg_shop__payments
    description: One row per payment attempt, with tidy names, types and units.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["success", "failed", "pending", "refunded"] # replace
