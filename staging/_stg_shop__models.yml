models:
  - name: stg_shop__payments
    description: Payments with tidy names, types and units. Can hold several versions of a payment, deduplicated downstream.
    columns:
      - name: payment_id
        data_tests:
          # warn, not error: this source keeps several versions of a payment, and
          # int_payments__deduplicated picks one. Use error if yours is one row per key.
          - unique:
              config:
                severity: warn
          - not_null
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["success", "failed", "pending", "refunded"] # replace
