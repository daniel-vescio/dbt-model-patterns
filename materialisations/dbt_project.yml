# Snippet: defaults by folder, so most models need no config.
# replace: shop_analytics with your project name, and the folders with yours

models:
  shop_analytics:
    # Only affects incremental models. The default, ignore, quietly leaves out new columns.
    +on_schema_change: append_new_columns

    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

      # A big incremental table, protected from accidental --full-refresh
      finance:
        fct_ledger_entries:
          +materialized: incremental
          +full_refresh: false
